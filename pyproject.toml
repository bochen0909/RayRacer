[project]
name = "rf"
version = "0.1.0"
description = "Ray-sensor car racing simulation for evolutionary / RL experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "neat-python>=2.0.0",
    "numpy>=2.4.6",
]

[project.optional-dependencies]
viz = [
    "pygame>=2.6.1",
]
rl = [
    "gymnasium>=1.4.0",
    "stable-baselines3>=2.9.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
